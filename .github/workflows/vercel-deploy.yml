name: Deploy to Vercel (dev) + Supabase

on:
  push:
    branches: ["dev"]
  workflow_dispatch:

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  supabase-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link Supabase project
        run: supabase link --project-ref ${{ env.SUPABASE_PROJECT_ID }}

      - name: Deploy Supabase DB migrations
        run: supabase db push --project-ref ${{ env.SUPABASE_PROJECT_ID }}

      - name: Deploy changed Supabase Edge Functions
        run: |
          # Deploy all functions (or list names to deploy selectively)
          supabase functions deploy --project-ref ${{ env.SUPABASE_PROJECT_ID }}

  vercel-deploy:
    needs: supabase-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Vercel / app secrets (scoped to this job)
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BETTER_AUTH_URL: ${{ secrets.BETTER_AUTH_URL }}
      BETTER_AUTH_SECRET: ${{ secrets.BETTER_AUTH_SECRET }}
      PINATA_JWT: ${{ secrets.PINATA_JWT }}
      PINATA_GATEWAY: ${{ secrets.PINATA_GATEWAY }}
      NEXT_PUBLIC_APP_URL: ${{ secrets.NEXT_PUBLIC_APP_URL }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Pull Vercel environment
        run: npx vercel pull --yes --environment=preview --token=$VERCEL_TOKEN

      - name: Run database migrations (Prisma)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy

      - name: Build
        run: npm run build

      - name: Deploy to Vercel
        run: npx vercel deploy --prebuilt --prod --yes --token=$VERCEL_TOKEN

      - name: Smoke test (optional)
        if: success()
        run: |
          STATUS=$(curl -s -o /dev/null -w '%{http_code}' "${NEXT_PUBLIC_APP_URL}/health")
          if [ "$STATUS" != "200" ]; then
            echo "Smoke test failed: status $STATUS"
            exit 1
          fi